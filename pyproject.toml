[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.1.0"
description = "A zero-dependency cron expression parser and scheduler for Python."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "WsNodeX" }]
keywords = ["cron", "schedule", "parser", "scheduler", "datetime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/WsNodeX/cairn"
Repository = "https://github.com/WsNodeX/cairn"

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
include = ["cairn*"]
